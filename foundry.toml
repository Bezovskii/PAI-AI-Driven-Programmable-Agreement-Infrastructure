[profile.default]
src = "contracts"
test = "test-foundry"
out = "artifacts/foundry"
cache_path = "cache/foundry"
libs = ["lib", "node_modules"]

solc_version = "0.8.35"
evm_version = "cancun"

optimizer = true
optimizer_runs = 200

remappings = [
    "@openzeppelin/=node_modules/@openzeppelin/",
    "forge-std/=lib/forge-std/src/"
]

[fuzz]
runs = 256

[invariant]
runs = 128
depth = 64
fail_on_revert = false
show_metrics = true