specVersion: 1.3.0

description: >
  PAI Arc settlement execution history.
  Indexes verifiable AgreementEscrow lifecycle facts only.
  PAI Core remains the semantic source of truth.

schema:
  file: ./schema.graphql

dataSources:
  - kind: ethereum/contract
    name: AgreementEscrow
    network: arc-testnet

    source:
      address: "0x7c97e321fB02446EA9aB14b6734Ad38D186b8CEa"
      abi: AgreementEscrow
      startBlock: 60776781

    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript

      entities:
        - Agreement
        - Milestone
        - SettlementEvent

      abis:
        - name: AgreementEscrow
          file: ./abis/AgreementEscrow.json

      eventHandlers:
        - event: AgreementCreated(indexed uint256,indexed address,indexed address,address,string)
          handler: handleAgreementCreated

        - event: MilestoneAdded(indexed uint256,indexed uint256,uint256,string)
          handler: handleMilestoneAdded

        - event: AgreementAccepted(indexed uint256,indexed address)
          handler: handleAgreementAccepted

        - event: AgreementFunded(indexed uint256,indexed address,address,uint256)
          handler: handleAgreementFunded

        - event: MilestoneSubmitted(indexed uint256,indexed uint256,indexed address,string,bytes32)
          handler: handleMilestoneSubmitted

        - event: MilestoneReleased(indexed uint256,indexed uint256,indexed address,address,uint256)
          handler: handleMilestoneReleased

        - event: MilestoneRefunded(indexed uint256,indexed uint256,indexed address,address,uint256)
          handler: handleMilestoneRefunded

        - event: MilestoneDisputeOpened(indexed uint256,indexed uint256,indexed address)
          handler: handleMilestoneDisputeOpened

        - event: MilestoneDisputeResolved(indexed uint256,indexed uint256,indexed address,address,bool,address,uint256)
          handler: handleMilestoneDisputeResolved

        - event: AgreementCompleted(indexed uint256)
          handler: handleAgreementCompleted

      file: ./src/mapping.ts